{% extends "base.html" %}
{% load static %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<section class="container-narrow py-4">
  <a href="{% url 'blog_index' %}" class="back-link">← All posts</a>
  <header class="post-header">
    <h1 class="page-title">{{ post.title }}</h1>
    <time class="post-date-line" datetime="{{ post.created_at|date:'c' }}">
      {{ post.created_at|date:"F j, Y" }}
    </time>
  </header>

  <div class="prose">{{ post.body|safe }}</div>
</section>

<!-- Force links inside the post body to open in a new tab -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.prose a').forEach(function (a) {
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener noreferrer');
    });
  });
</script>
{% endblock %}
