{% extends "base.html" %}

{% load static %}

{% block title %}{{ post.title }}{% endblock %}


{% block content %}
  <h1>{{ post.title }}</h1>
  <p><small>{{ post.created_at|date:"F j, Y" }}</small></p>
  {% if post.image %}
    <img src="{{ post.image.url }}" style="max-width:100%;">
  {% endif %}
  <div>{{ post.body|linebreaks }}</div>
{% endblock %}
