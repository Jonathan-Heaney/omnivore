{% extends "base.html" %}

{% load static %}

{% block title %}{{ post.title }}{% endblock %}


{% block content %}
<section class="container-narrow py-4">
  <h1 class="page-title">{{ post.title }}</h1>
  <p><small>{{ post.created_at|date:"F j, Y" }}</small></p>
  <div class="prose">{{ post.body|safe }}</div>
</section>  
{% endblock %}
