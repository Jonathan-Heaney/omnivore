{% extends "base.html" %}
{% load static %}

{% block title %}Blog{% endblock %}

{% block content %}
<section class="container-narrow py-4">
  <h1 class="page-title">Blog</h1>

  <ul class="post-list">
    {% for post in posts %}
      <li class="post-item">
        <a class="post-link" href="{% url 'blog_detail' post.slug %}">
          <span class="post-title">{{ post.title }}</span>
          <time class="post-date" datetime="{{ post.created_at|date:'c' }}">
            {{ post.created_at|date:"F j, Y" }}
          </time>
          <span class="post-link-arrow" aria-hidden="true">→</span>
        </a>
      </li>
    {% empty %}
      <li class="post-empty">No posts yet.</li>
    {% endfor %}
  </ul>
</section>  
{% endblock %}
