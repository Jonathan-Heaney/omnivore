{% extends "base.html" %}
{% load static %}

{% block title %}Blog{% endblock %}


{% block content %}
<section class="container-narrow py-4">
  <h1 class="page-title">Blog</h1>
  <ul>
    {% for post in posts %}
      <li>
        <a href="{% url 'blog_detail' post.slug %}">{{ post.title }}</a><br>
        <small>{{ post.created_at|date:"F j, Y" }}</small>
      </li>
    {% empty %}
      <li>No posts yet.</li>
    {% endfor %}
  </ul>
</section>  
{% endblock %}
